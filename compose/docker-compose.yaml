# Core + Web 控制台一体部署
# 镜像说明: https://hub.docker.com/r/majosissi/easytier
services:
  easytier:
    # majosissi/easytier:latest   最新 Release 正式版
    # majosissi/easytier:pre      最新 Pre-release 预览版
    # majosissi/easytier:nightly  最新 Nightly 每夜版
    image: majosissi/easytier:latest
    container_name: easytier
    restart: always
    # 限制容器输出日志的大小和数量, 建议启用, 防炸日志
    logging:
      driver: "json-file"
      options:
        # 单个日志文件的最大大小  
        max-size: "10m"
        # 最多保留的日志文件数量
        max-file: "3"
    network_mode: host
    environment:
      - TZ=Asia/Shanghai
      # -------------------------------------------
      # 自定义节点主机名, 可用于 Web 控制台显示和区分不同节点
      # 默认: 无
      - HOSTNAME=node1
      # 安全模式, 根据其他节点或 Web 控制台要求启用
      # 默认: false
      # - SECURE_MODE=false
      # -------------------------------------------
      # 连接其他远程 Web 控制台, 将强制禁用本地 Web 控制台 (EasyTier Pro控制台必须启用[安全模式])
      # 示例: udp://api.web.com:22020/username
      # 默认: 无
      # - WEB_REMOTE_SERVER=协议://主机:端口/用户名
      # -------------------------------------------
      # 是否启用 Web 管理界面 
      # 默认: false
      - WEB_ENABLE=false
      # -------------------------------------------
      # 是否允许注册新用户 (内置用户: admin, 密码: admin, 登录后右上角可修改密码)
      # 默认: false
      - WEB_ENABLE_REGISTRATION=false
      # -------------------------------------------
      # Web 管理用户名; 设置 WEB_REMOTE_SERVER 时此项无效
      # 启用 Web 且提供用户名时将自动连接本地控制台
      # 自定义用户名，需要先手动注册对应用户名才行 
      # 默认: 无
      - WEB_USERNAME=admin
      # -------------------------------------------
      # !!! 2.7.0 Pre预览版开始, 将移除此项 !!!
      # 主机物理IP地址 (公网 / 内网)
      # 默认: http://127.0.0.1:11211
      - WEB_DEFAULT_API_HOST=http://修改为你的主机:11211
      # -------------------------------------------
      # Web 访问端口
      # 默认: 11211
      - WEB_PORT=11211
      # -------------------------------------------
      # Web 管理服务 (RPC) 监听端口, Core 将通过此端口连接
      # 默认: 22020
      - WEB_SERVER_PORT=22020
      # -------------------------------------------
      # 监听配置服务器协议 core 将通过此协议连接 Web 服务
      # 可选: [ udp | tcp | ws ]
      # 默认: udp
      # - WEB_SERVER_PROTOCOL=udp
      # -------------------------------------------
      # GeoIP 数据库文件路径 (可在 Web 控制台显示地理位置信息)
      # 推荐: https://github.com/P3TERX/GeoLite.mmdb/releases (文件位置对应容器内部的具体路径)
      # 默认: 无
      # - WEB_GEOIP_PATH=/app/data/web/GeoLite2-City.mmdb
      # -------------------------------------------
      # Web 服务日志级别
      # 可选: [ error | warn | info | debug | trace] 
      # 默认: 无 (程序默认日志行为)
      # - WEB_LOG_LEVEL=info
      # -------------------------------------------
      # Core 服务日志级别
      # 可选: [ error | warn | info | debug | trace] 
      # 默认: 无 (程序默认日志行为)
      # - CORE_LOG_LEVEL=info
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      # 数据目录
      - ./data:/app/data
      # 日志目录
      - ./logs:/app/logs
      # 将写好的配置文件放在 ./data/config 下每个文件都是一个实例 (.toml格式)
      # 会跟着容器一起启动/运行, Web 上可见, 可编辑
