name: EasyTier Nightly Docker Image
#  `DOCKERHUB_USERNAME`: DockerHub 用户名
#  `DOCKERHUB_TOKEN`: DockerHub Access Token

on:
  workflow_dispatch:
    inputs:
      custom_docker_tag:
        description: '自定义镜像版本标签（可选，不填则默认为 "nightly"）'
        required: false
        default: ''
  push:
    paths:
      - 'docker/**'
      - 'scripts/**'
  schedule:
    - cron: '0 0 * * *'

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get latest nightly version
        id: get_version
        run: |
          RELEASE=$(curl -s https://api.github.com/repos/EasyTier/EasyTier/releases/tags/nightly)
          NIGHTLY_TAG=$(echo "$RELEASE" | jq -r '.tag_name')
          PUBLISHED_AT=$(echo "$RELEASE" | jq -r '.published_at')
          # nightly 的资产文件名内嵌版本号, 例如 easytier-linux-x86_64-v2.7.0.zip
          ASSET=$(echo "$RELEASE" | jq -r '[.assets[].name | select(startswith("easytier-linux-x86_64-"))][0]')
          if [ -z "$ASSET" ] || [ "$ASSET" = "null" ]; then
            echo "No nightly asset found." >&2
            exit 1
          fi
          FILE_VERSION="${ASSET#easytier-linux-x86_64-}"
          FILE_VERSION="${FILE_VERSION%.zip}"
          echo "Nightly tag: $NIGHTLY_TAG"
          echo "Nightly version: $FILE_VERSION"
          echo "Published at: $PUBLISHED_AT"
          echo "version_tag=$NIGHTLY_TAG" >> $GITHUB_OUTPUT
          echo "file_version=$FILE_VERSION" >> $GITHUB_OUTPUT
          echo "published_at=$PUBLISHED_AT" >> $GITHUB_OUTPUT

      - name: Check if version changed
        id: check_version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] || [ "${{ github.event_name }}" == "push" ]; then
            echo "Manual or relevant file change detected. Forcing build."
            echo "build=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          if [ -f .github/state/LAST_NIGHTLY_VERSION ]; then
            CURRENT_VERSION=$(cat .github/state/LAST_NIGHTLY_VERSION)
          else
            CURRENT_VERSION=""
          fi

          # nightly 的 tag 固定不变, 用发布时间判断是否有新的构建
          LATEST_VERSION="${{ steps.get_version.outputs.published_at }}"

          if [ "$LATEST_VERSION" != "$CURRENT_VERSION" ]; then
            echo "New nightly build detected: $LATEST_VERSION"
            echo "build=true" >> $GITHUB_OUTPUT
          else
            echo "Nightly $LATEST_VERSION is already built."
            echo "build=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up QEMU
        if: steps.check_version.outputs.build == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.check_version.outputs.build == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: steps.check_version.outputs.build == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        if: steps.check_version.outputs.build == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.nightly
          push: true
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          build-args: |
            VERSION=${{ steps.get_version.outputs.version_tag }}
            FILE_VERSION=${{ steps.get_version.outputs.file_version }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/easytier:${{ github.event.inputs.custom_docker_tag || 'nightly' }}

      - name: Update LAST_NIGHTLY_VERSION file
        if: steps.check_version.outputs.build == 'true'
        run: |
          mkdir -p .github/state
          echo "${{ steps.get_version.outputs.published_at }}" > .github/state/LAST_NIGHTLY_VERSION
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'actions@github.com'
          git add .github/state/LAST_NIGHTLY_VERSION
          git diff --staged --quiet || (git commit -m "Update LAST_NIGHTLY_VERSION to ${{ steps.get_version.outputs.published_at }}" && git pull --rebase && git push)
